name: Build Atlas Cobblemon Fabric
on:
  push:
    branches: [cobblemon-fabric-1.21.1]
    paths:
      - 'cobblemon-fabric/**'
      - '.github/workflows/cobblemon-fabric.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Fabric JAR
        working-directory: cobblemon-fabric
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Cobblemon-Fabric
          path: cobblemon-fabric/build/libs/*.jar
          if-no-files-found: error
